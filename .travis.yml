sudo: false
language: python
python: 3.13
cache: pip
fast_finish: true
branches:
  only:
  - develop
  - uat
  - prod
install:
  - pip install -U awscli cfn-lint "sceptre>=4.6" sceptre-ssm-resolver
  - ./setup_aws_cli.sh || travis_terminate 1
stages:
  - name: validate
  - name: deploy
    if: type = push
jobs:
  include:
    - stage: validate
      script: cfn-lint ./templates/**/*
    - stage: deploy
      script:
        - sceptre launch common --yes
        - sceptre launch $TRAVIS_BRANCH --yes
